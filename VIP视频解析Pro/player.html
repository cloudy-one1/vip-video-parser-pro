<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100d0a">
  <meta name="description" content="m3u8 与视频流直连播放页:本地 hls.js 引擎,零第三方页面依赖,含失败重试与官方播放器回退。">
  <title>播放器 · VIP 视频解析 Pro</title>
  <style>
    /* Hallmark · shape: app screen · genre: custom · theme: custom · redesign: full
     * idea: "深夜放映室:灯只照画面" · axes: dark/handwritten/warm · paper: oklch(9% 0.012 70) · accent: oklch(80% 0.115 75) · v2.0.0 */
    /* Hallmark · pre-emit critique: P3 H3 E4 S4 R4 V4 · weakest: E, a bare player page has little to execute; tokens mirror the main page's warm ground, the face stays system by the project's zero-CDN rule */
    /* Hallmark · waive 28b · no poster asset exists and none may be invented; the overlay covers the frame until the stream starts · the video is the page's only content */
    /* 自建 hls.js 播放器:云搜索 / m3u8 直连专用,全程零第三方页面 */
    :root {
      color-scheme: dark;
      --color-video-ground: oklch(9% 0.012 70);
      --color-ink: oklch(92% 0.02 85);
      --color-ink-2: oklch(84% 0.025 80);
      --color-muted: oklch(67% 0.028 75);
      --color-rule-2: oklch(42% 0.024 72);
      --color-accent: oklch(80% 0.115 75);
      --color-accent-ink: oklch(17% 0.02 70);
      --color-focus: oklch(84% 0.13 80);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --dur-short: 220ms;
    }
    html { scrollbar-color: var(--color-rule-2) var(--color-video-ground); }
    ::selection { background: var(--color-accent); color: var(--color-accent-ink); }
    html, body { margin: 0; height: 100%; background: var(--color-video-ground); overflow: clip; }
    body { display: flex; align-items: center; justify-content: center;
           font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
    video { width: 100%; height: 100%; background: var(--color-video-ground); outline: none; }
    video:focus-visible { outline: 2px solid var(--color-focus); outline-offset: -2px; }
    .overlay {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: var(--color-video-ground); color: var(--color-muted); font-size: 14px; text-align: center; padding: 0 24px;
    }
    .overlay.hide { display: none; }
    .overlay .msg { max-width: 420px; line-height: 1.7; }
    .overlay button {
      padding: 8px 16px; border: 1px solid var(--color-rule-2); border-radius: 8px;
      background: transparent; color: var(--color-ink); font-size: 13.5px; font-family: inherit; cursor: pointer;
      transition: border-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out);
    }
    .overlay button:hover { border-color: var(--color-accent); color: var(--color-accent); }
    .overlay button:active { transform: translateY(1px); }
    .overlay button:disabled { opacity: 0.45; cursor: not-allowed; }
    .overlay button:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
  <video id="video" controls playsinline></video>
  <div id="overlay" class="overlay">
    <p class="msg" id="msg">正在加载视频流…</p>
    <div class="row" id="actions" hidden>
      <button id="retryBtn" type="button">重试</button>
      <button id="remoteBtn" type="button">换官方播放器打开</button>
    </div>
  </div>

  <!-- hls.js v1.7.4(Apache-2.0)light 版本地化,避免任何 CDN 依赖 -->
  <script src="js/vendor/hls.light.min.js"></script>
  <script>
    (function () {
      'use strict';
      var params = new URLSearchParams(location.search);
      var src = params.get('src') || '';
      var video = document.getElementById('video');
      var overlay = document.getElementById('overlay');
      var msg = document.getElementById('msg');
      var actions = document.getElementById('actions');
      var retryBtn = document.getElementById('retryBtn');
      var remoteBtn = document.getElementById('remoteBtn');
      var hls = null;
      var started = false;

      function setMsg(text, withActions) {
        msg.textContent = text;
        actions.hidden = !withActions;
        overlay.classList.remove('hide');
      }
      function hideOverlay() { overlay.classList.add('hide'); }

      function fail(text) { setMsg(text, true); }

      function start() {
        if (!src) { fail('缺少视频地址(?src=)'); return; }
        if (started) { video.pause(); }   // 重试时先停掉旧流
        started = true;
        hideOverlay();
        setMsg('正在加载视频流…', false);

        var isM3u8 = /\.m3u8([?#]|$)/i.test(src);
        // Safari 原生支持 HLS,直接喂给 video
        if (window.Hls && window.Hls.isSupported() && isM3u8) {
          if (hls) { hls.destroy(); hls = null; }
          hls = new window.Hls({ maxBufferLength: 30 });
          hls.loadSource(src);
          hls.attachMedia(video);
          hls.on(window.Hls.Events.MANIFEST_PARSED, function () {
            hideOverlay();
            var p = video.play();
            if (p && p.catch) p.catch(function () { /* 自动播放被策略拦时,用户手点播放即可 */ });
          });
          hls.on(window.Hls.Events.ERROR, function (evt, data) {
            if (!data || !data.fatal) return;
            if (data.type === window.Hls.ErrorTypes.NETWORK_ERROR && data.details === 'manifestParsingError') {
              fail('视频流地址无法解析(可能已失效)');
            } else {
              fail('视频流加载失败(' + data.details + ')');
            }
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl') && isM3u8) {
          video.src = src;
          video.play().catch(function () {});
        } else {
          // 非 HLS 地址(容错):直接交给 video
          video.src = src;
          video.play().catch(function () {});
        }
      }

      retryBtn.addEventListener('click', function () { started = false; start(); });
      remoteBtn.addEventListener('click', function () {
        // 回退到无损云官方播放器。本页可能被宿主沙箱成不透明源(无 allow-same-origin,
        // 自身 localStorage 不可用)——此时不自行导航,postMessage 请宿主页代为
        // 升级沙箱级别再导航;独立打开(无宿主)时才直接 replace。
        var fallbackUrl = 'https://wsyzy.vip/m3u8/?url=' + encodeURIComponent(src);
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ vvproRemoteFallback: src }, '*');
            setMsg('正在切换到官方播放器…', false);
            return;
          }
        } catch (e) { /* 落回直接导航 */ }
        location.replace(fallbackUrl);
      });

      start();
    })();
  </script>
</body>
</html>
